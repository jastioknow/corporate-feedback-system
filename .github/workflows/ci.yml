name: CI-Check

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest
    services:
      postgres-db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: corporate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/corporate_db?schema=public
    steps:
      - name: Copy repository code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Run Eslint
        run: pnpm run lint
      - name: typeScript Check
        run: pnpm run type-check

      - name: Run Database Migrations
        run: pnpm run prisma:migrate:deploy
      - name: Seed Database
        run: pnpm run prisma:seed

      - name: Build Shared Libraries
        run: pnpm nx run-many -t build --projects=@corporate/db

      - name: Run e2e Tests
        run: pnpm run test:e2e

      - name: Build Project
        run: pnpm run build
